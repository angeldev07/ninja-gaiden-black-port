[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ngb-tools"
version = "0.1.0"
description = "Reverse-engineering tools for the native PC port of Ninja Gaiden Black (Xbox)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[project.scripts]
ngb-hygiene = "ngb_tools.hygiene:main"
ngb-xbe = "ngb_tools.xbe.cli:run"
ngb-afs = "ngb_tools.afs.cli:run"
ngb-xpr = "ngb_tools.xpr.cli:run"
ngb-kmd = "ngb_tools.kmd.cli:run"
ngb-gallery = "ngb_tools.gallery.cli:run"
ngb-audio = "ngb_tools.audio.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ngb_tools = ["py.typed", "data/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import ordering
    "N",        # PEP 8 naming
    "UP",       # modern syntax
    "B",        # bugbear
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PTH",      # pathlib instead of os.path
    "RET",      # returns coherentes
    "PL",       # pylint (ruff subset)
    "RUF",      # ruff-specific rules
]
ignore = [
    "PLR2004",  # magic numbers: in binary formats the offsets are the data
    "PLR0913",  # parsing functions with many fields
    "RUF001", "RUF002", "RUF003",  # non-ASCII characters in comments and strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "N802"]
# Reference prototypes of the launcher's C art (see their docstrings): kept as written, not maintained.
"tools/proto/**" = ["E501", "N", "PTH", "PLR", "PLW", "SIM", "C4", "RET", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["ngb_tools"]
strict = true
warn_unreachable = true
